<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2 class="mt-4">Lista de Hospitales</h2>

<table class="table table-bordered">
    <thead class="table-light">
    <tr>
        <th>#</th>
        <th>Nombre</th>
        <th>Direccion</th>
        <th>Teléfono</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="hospital : ${hospitalList}">
        <td th:text="${hospital.id}">1</td>
        <td th:text="${hospital.nombre}">x</td>
        <td th:text="${hospital.direccion}">x</td>
        <td th:text="${hospital.telefono}">x</td>
        <td>
            <a class="btn btn-sm btn-primary">Mostrar doctores</a>
            <a class="btn btn-sm btn-primary">Mostrar pacientes</a>
        </td>
    </tr>
    </tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
