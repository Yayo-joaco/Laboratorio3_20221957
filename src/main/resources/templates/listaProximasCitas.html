<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title Proximas Citas ></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="index :: navbarFragment"></div>

<div class="container mt-5">
  <h2 class="mt-4" th:text="'Próximas Citas del Dr. ' + ${doctor.nombre}">Próximas Citas</h2>

  <table class="table table-bordered">
    <thead class="table-light">
    <tr>
      <th>#</th>
      <th>Nombre Paciente</th>
      <th>Fecha Cita</th>
      <th>Diagnóstico</th>
      <th>Habitación</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="paciente : ${listaProximasCitas}">
      <td th:text="${paciente.id}"></td>
      <td th:text="${paciente.nombre}"></td>
      <td th:text="${#temporals.format(paciente.fechaCita, 'dd-MM-yyyy')}"></td> <td th:text="${paciente.diagnostico}"></td>
      <td th:text="${paciente.numeroHabitacion}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(listaProximasCitas)}">
      <td colspan="5">No hay próximas citas para este doctor.</td>
    </tr>
    </tbody>
  </table>

  <a th:href="@{/doctores}" class="btn btn-secondary mt-3">Volver a la lista de doctores</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
