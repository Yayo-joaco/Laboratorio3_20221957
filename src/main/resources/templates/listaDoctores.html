<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title Lista Doctores por Hospital></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="index :: navbarFragment"></div>

<div class="container mt-5">
  <h2 class="mt-4" th:text="'Doctores del Hospital: ' + ${hospital.nombre}">Doctores del Hospital</h2>

  <table class="table table-bordered">
    <thead class="table-light">
    <tr>
      <th>#</th>
      <th>Nombre</th>
      <th>Especialidad</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="doctor : ${listaDoctores}">
      <td th:text="${doctor.id}"></td>
      <td th:text="${doctor.nombre}"></td>
      <td th:text="${doctor.especialidad}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(listaDoctores)}">
      <td colspan="3">No hay doctores registrados en este hospital.</td>
    </tr>
    </tbody>
  </table>

  <a th:href="@{/hospital}" class="btn btn-secondary mt-3">Volver a la lista de hospitales</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
