<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hospital</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="index :: navbarFragment"></div>

<div class="container mt-5">
    <h2 class="mt-4">Lista de Hospitales</h2>

    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Direccion</th>
            <th>Teléfono</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="hospital : ${hospitalList}">
            <td th:text="${hospital.id}"></td>
            <td th:text="${hospital.nombre}"></td>
            <td th:text="${hospital.direccion}"></td>
            <td th:text="${hospital.telefono}"></td>
            <td>
                <a th:href="@{/hospital/{id}/doctores(id=${hospital.id})}" class="btn btn-sm btn-primary">
                    Mostrar doctores
                </a>
                <a th:href="@{/hospital/{id}/pacientes(id=${hospital.id})}" class="btn btn-sm btn-primary">
                    Mostrar pacientes
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
