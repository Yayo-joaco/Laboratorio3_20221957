<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="index :: navbarFragment"></div>

<div class="container mt-5">
    <h2 class="mt-4">Lista Completa de Doctores</h2>

    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Especialidad</th>
            <th>Hospital</th>
            <th>Acciones</th> </tr>
        </thead>
        <tbody>
        <tr th:each="doctor : ${listaDoctores}">
            <td th:text="${doctor.id}"></td>
            <td th:text="${doctor.nombre}"></td>
            <td th:text="${doctor.especialidad}"></td>
            <td th:text="${doctor.hospital != null ? doctor.hospital.nombre : 'N/A'}"></td>
            <td>
                <a th:href="@{/doctores/{id}/proximas-citas(id=${doctor.id})}" class="btn btn-sm btn-info">
                    Próximas citas
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaDoctores)}">
            <td colspan="5">No hay doctores registrados en el sistema.</td> </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary mt-3">Volver al Inicio</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
