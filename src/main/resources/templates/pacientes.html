<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pacientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="index :: navbarFragment"></div>

<div class="container mt-5">
    <h2 class="mt-4">Lista de Pacientes</h2>

    <a th:href="@{/pacientes/derivar}" class="btn btn-primary mb-3">Derivar pacientes</a>

    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Edad</th>
            <th>Género</th>
            <th>Diagnóstico</th>
            <th>Fecha Cita</th>
            <th>Habitación</th>
            <th>Doctor Asignado</th>
            <th>Hospital</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="paciente : ${listaPacientes}">
            <td th:text="${paciente.id}"></td>
            <td th:text="${paciente.nombre}"></td>
            <td th:text="${paciente.edad}"></td>
            <td th:text="${paciente.genero}"></td>
            <td th:text="${paciente.diagnostico}"></td>
            <td th:text="${#temporals.format(paciente.fechaCita, 'dd-MM-yyyy')}"></td>
            <td th:text="${paciente.numeroHabitacion}"></td>
            <td th:text="${paciente.doctor != null ? paciente.doctor.nombre : 'N/A'}"></td>
            <td th:text="${paciente.hospital != null ? paciente.hospital.nombre : 'N/A'}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaPacientes)}">
            <td colspan="9">No hay pacientes registrados en el sistema.</td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary mt-3">Volver al Inicio</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
